name: secrets

# 비밀 값 스캔 (ADR-0003). 커밋 전 훅(.githooks/pre-commit)과 같은 검사를 서버에서 한 번 더 한다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 기록을 스캔한다
      - name: gitleaks 설치
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: 전체 기록 스캔
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner'
