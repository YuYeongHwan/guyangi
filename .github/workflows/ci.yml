name: ci

# 규칙은 docs/adr/0003-cron-vs-queue.md "CI 보안 규칙", 작업 목록은 docs/testing.md 5장.
# - paths 필터를 쓰지 않는다: 필수 검사가 실행되지 않으면 PR 이 영원히 대기한다.
# - pull_request_target 을 쓰지 않는다: 포크의 코드를 저장소 권한으로 실행하게 된다.
# - 외부 액션은 커밋 SHA 로 고정한다 (갱신은 TASKS 6.5).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_CLI_VERSION: 3.1.0
  UV_VERSION: 0.12.11

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 건너뛴 테스트 검사 (skip, only, fixme, xfail)
        run: scripts/check-no-skip.sh
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/matcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/matcher/uv.lock
      # Python 버전은 services/matcher/.python-version 을 uv 가 읽는다
      - run: uv sync --locked
      - run: uv run pytest

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # DB, Auth, PostgREST, 게이트웨이만 띄운다. storage-api 와 realtime 은 쓰는 항목(TASKS 2.2, 5.8)에서 다시 넣는다.
      - name: 로컬 Supabase 기동
        run: supabase start -x studio,logflare,vector,imgproxy,edge-runtime,mailpit,postgres-meta,supavisor,storage-api,realtime
      - run: supabase db reset
      - run: pnpm test:db
      # 매처 통합 테스트(uv run pytest -m integration)는 TASKS 4.12 에서 이 작업에 넣는다.

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright 버전 확인
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # 캐시가 있으면 내려받기는 건너뛰고 시스템 라이브러리만 설치한다
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # 빌드 후 실행한 앱에 대해 돈다 (apps/web/playwright.config.ts). E8 도 이 작업에서 돈다.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  prod-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 운영 설정(테스트용 환경 변수 없음)으로 빌드가 되는지만 본다.
      # E6·E7(테스트 로그인 경로 404, 산출물에 없음)은 그 경로가 생기는 TASKS 2.8 에서 붙인다.
      - run: pnpm build
