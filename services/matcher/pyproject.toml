[project]
name = "guyangi-matcher"
version = "0.0.0"
description = "구양이 매칭 엔진 (1:1, 3자 순환). 알고리즘은 docs/matcher.md"
requires-python = ">=3.12,<3.13"
# networkx, supabase 는 실제로 쓰는 Sprint 4 (TASKS 4.5, 4.12) 에서 추가한다.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 기본 실행은 단위 테스트만. 성능은 `-m slow`, DB 연동은 `-m integration` (docs/testing.md 2장)
addopts = [
    "--strict-markers",
    "-m", "not slow and not integration",
    "--cov=matcher",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "slow: 성능 테스트 (1000명 규모). uv run pytest -m slow",
    "integration: 로컬 Supabase 가 필요한 테스트. uv run pytest -m integration",
]

[tool.coverage.report]
# docs/testing.md 6장: 매처는 줄·분기 90% 이상
fail_under = 90
